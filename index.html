<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#03030a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="The Order of Xilence">
  <link rel="icon" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <title>The Order of Xilence</title>
  <style>
    :root {
      --navy: #03030a;
      --cyan: #00f5ff;
      --red: #ff003c;
      --yellow: #ffe600;
      --purple: #7c3aff;
      --font: Impact, "Arial Black", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--navy);
      color: #fff;
      font-family: var(--font);
    }

    .game-shell {
      position: relative;
      width: min(100vw, calc(100vh * 16 / 9));
      aspect-ratio: 16 / 9;
      box-shadow: 0 0 40px rgba(0, 245, 255, 0.25);
    }

    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: var(--navy);
      border: 3px solid var(--cyan);
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
    }

    /* ---------------------------------------------------------------- Controles táctiles (teléfono y tableta) */
    html, body { overscroll-behavior: none; }

    body.touch {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;
      min-height: 0;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    body.touch .game-shell { width: min(100vw, calc(100dvh * 16 / 9)); }

    /* La capa ocupa toda la pantalla (los controles se apoyan en los bordes, también sobre las franjas negras) */
    .touch-layer { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
    #modal-root { z-index: 20; }

    .touch-layer button, .touch-stick-zone { pointer-events: auto; touch-action: none; }

    .touch-stick-zone {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 46vw;
      height: 78vh;
    }

    .touch-stick-base {
      position: absolute;
      left: calc(8vh + env(safe-area-inset-left, 0px));
      bottom: calc(8vh + env(safe-area-inset-bottom, 0px));
      width: 27vh;
      height: 27vh;
      border-radius: 50%;
      border: 0.7vh solid rgba(0, 245, 255, 0.55);
      background: radial-gradient(circle, rgba(0, 245, 255, 0.10), rgba(3, 3, 10, 0.45));
      box-shadow: 0 0 2vh rgba(0, 245, 255, 0.35), inset 0 0 2vh rgba(0, 0, 0, 0.6);
      opacity: 0.8;
      transition: opacity 0.15s;
    }

    .touch-stick-base.active { opacity: 1; border-color: var(--cyan); }

    .touch-stick-knob {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 11vh;
      height: 11vh;
      margin: -5.5vh 0 0 -5.5vh;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #ffffff, var(--cyan) 55%, #005e8a);
      box-shadow: 0 0 1.6vh var(--cyan);
    }

    .touch-button {
      position: absolute;
      border-radius: 50%;
      border: 0.7vh solid var(--cyan);
      background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.22), rgba(3, 3, 10, 0.62));
      color: #fff;
      font-family: var(--font);
      font-style: italic;
      font-size: 3.1vh;
      letter-spacing: 0.04em;
      text-shadow: 0 0.3vh 0 #000, 0 0 1vh currentColor;
      box-shadow: 0 0 1.8vh rgba(0, 245, 255, 0.4);
      padding: 0;
      opacity: 0.85;
    }

    .touch-button.touch-yellow { border-color: var(--yellow); color: var(--yellow); box-shadow: 0 0 1.8vh rgba(255, 230, 0, 0.45); font-size: 3.6vh; }
    .touch-button.touch-purple { border-color: #b78cff; color: #d9c4ff; box-shadow: 0 0 1.8vh rgba(124, 58, 255, 0.55); }
    .touch-button.touch-cyan { color: #aef9ff; }
    .touch-button.touch-white { border-color: #cfd6e6; color: #e8edf8; box-shadow: 0 0 1.4vh rgba(255, 255, 255, 0.3); font-size: 2.7vh; }

    /* Duelo musical: cuatro pads grandes para tocar las notas */
    .touch-duel { position: fixed; inset: 0; z-index: 10; pointer-events: none; display: none; }
    .touch-pad {
      position: absolute;
      bottom: calc(3vh + env(safe-area-inset-bottom, 0px));
      width: 18vh;
      height: 18vh;
      transform: translateX(-50%);
      border-radius: 50%;
      border: 0.8vh solid currentColor;
      background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.25), rgba(3, 3, 10, 0.6));
      font-family: var(--font);
      font-style: italic;
      font-size: 5vh;
      text-shadow: 0 0.3vh 0 #000, 0 0 1vh currentColor;
      box-shadow: 0 0 2vh currentColor;
      padding: 0;
      opacity: 0.85;
      pointer-events: auto;
      touch-action: none;
    }
    .touch-pad.pressed { opacity: 1; background: currentColor; color: #000; }

    .touch-button.pressed {
      opacity: 1;
      transform: scale(0.92);
      background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.6), rgba(0, 245, 255, 0.35));
    }

    .touch-system {
      position: absolute;
      top: calc(1.6vh + env(safe-area-inset-top, 0px));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 1.6vh;
    }

    .touch-small {
      width: 7vh;
      height: 7vh;
      border-radius: 1.4vh;
      border: 0.5vh solid rgba(255, 255, 255, 0.55);
      background: rgba(3, 3, 10, 0.55);
      color: #fff;
      font-family: var(--font);
      font-size: 3.2vh;
      padding: 0;
      opacity: 0.8;
    }

    /* Aviso para girar el teléfono: el juego es panorámico */
    .rotate-hint {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3vh;
      background: var(--navy);
      color: var(--cyan);
      font-size: 7vw;
      text-align: center;
      text-shadow: 0 0 2vw var(--cyan);
      pointer-events: auto;
    }

    .rotate-hint .phone {
      width: 16vw;
      height: 26vw;
      border: 1vw solid var(--cyan);
      border-radius: 3vw;
      box-shadow: 0 0 3vw var(--cyan);
      animation: rotate-phone 2.4s ease-in-out infinite;
    }

    @keyframes rotate-phone {
      0%, 20% { transform: rotate(0deg); }
      60%, 100% { transform: rotate(-90deg); }
    }

    @media (orientation: portrait) {
      body.touch .rotate-hint { display: flex; }
    }

    /* Modal con el estilo visual del juego */
    #modal-root { position: absolute; inset: 0; pointer-events: none; }

    .modal-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(3, 3, 10, 0.78);
      pointer-events: auto;
    }

    /* Tarjeta de cierre: sin velo oscuro, pegada abajo para dejar ver la ilustración */
    .modal-overlay--card {
      align-items: flex-end;
      justify-content: flex-start;
      padding: 0 0 4% 3.5%;
      background: linear-gradient(to top, rgba(3, 3, 10, 0.7) 0%, rgba(3, 3, 10, 0) 55%);
    }

    .modal-overlay--card .modal-panel { min-width: 300px; padding: 22px 30px; }

    .modal-panel {
      min-width: 320px;
      max-width: 80%;
      padding: 28px 36px;
      text-align: center;
      background: var(--navy);
      border: 4px solid #000;
      outline: 3px solid var(--cyan);
      box-shadow: 0 0 32px var(--cyan), inset 0 0 24px rgba(124, 58, 255, 0.35);
    }

    .modal-title {
      margin: 0 0 14px;
      font-size: 2.9rem;
      font-style: italic;
      letter-spacing: 0.06em;
      line-height: 1.05;
      /* Cromo: reflejo arriba, horizonte oscuro en el centro */
      background: linear-gradient(180deg, #fff 0%, var(--cyan) 46%, #00608f 50%, var(--cyan) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-stroke: 1px rgba(0, 0, 0, 0.9);
      filter: drop-shadow(3px 4px 0 #000) drop-shadow(0 0 14px var(--cyan));
      transform: skewX(-8deg);
    }

    .modal-message {
      margin: 0 0 22px;
      font-family: Arial, sans-serif;
      font-size: 1.05rem;
      color: #cfe;
      white-space: pre-line;
      line-height: 1.5;
    }

    .modal-actions { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }

    .modal-button {
      padding: 11px 28px;
      font-family: var(--font);
      font-size: 1.2rem;
      font-style: italic;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #1a0a00;
      background: linear-gradient(180deg, #fff6a8 0%, var(--yellow) 45%, #d06000 50%, #ffb000 100%);
      border: 3px solid #000;
      box-shadow: 5px 5px 0 #000, 0 0 16px rgba(255, 176, 0, 0.55);
      transform: skewX(-10deg);
      cursor: pointer;
      transition: transform 0.08s, box-shadow 0.08s;
    }

    .modal-button:hover,
    .modal-button:focus-visible {
      background: linear-gradient(180deg, #ffffff 0%, var(--cyan) 45%, #00608f 50%, #00c8d8 100%);
      box-shadow: 5px 5px 0 #000, 0 0 22px var(--cyan);
      transform: skewX(-10deg) scale(1.07);
      outline: none;
    }

    .modal-button:active { transform: skewX(-10deg) translate(3px, 3px); box-shadow: 2px 2px 0 #000; }
  </style>
</head>
